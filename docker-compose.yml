version: "3.9"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: nexusai-db
    environment:
      POSTGRES_DB: nexusai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexusai_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: nexusai-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_password}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # NexusAI App
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexusai-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-nexusai_password}@postgres:5432/nexusai
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_password}@redis:6379
    ports:
      - "3000:3000"
    volumes:
      - ./uploads:/app/uploads
      - ./wa-session:/app/wa-session
    restart: unless-stopped

  # WhatsApp Bot (separate service)
  whatsapp-bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: nexusai-wabot
    depends_on:
      - app
    env_file:
      - .env
    volumes:
      - ./wa-session:/app/wa-session
    restart: unless-stopped
    profiles:
      - whatsapp

volumes:
  postgres_data:
  redis_data:
